# python NVSynthesis/apis/main.py --mode test -opt configs/_base_/NVSynthesis/baseline_test.yml

#### basic setup
name: diffusion_ori_baseline
use_tb_logger: false

#### datasets
datasets:
  base: mstar-default

#### test
gpu_ids: [0]
scheme: supervised
sub_scheme: original
pretrain: sar_pretrained
setting:
  base: test

#### network
network:
  base: baseline_xunet

#### pipeline
pipeline: diffusion
sub_pipeline: original
pipL:
  logsnr_min: -20.0
  logsnr_max: 20.0
  total_timestep: 256
  w: [0, 1, 2, 3, 4, 5, 6, 7]

path:
  pretrain_model_pth: experiments/diffusion_ori/pretrained/models/baseline.pt
