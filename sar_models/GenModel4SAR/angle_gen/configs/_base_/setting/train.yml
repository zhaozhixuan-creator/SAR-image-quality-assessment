#### training settings: learning rate scheme, loss
setting:
  optimizer: Adam # Adam, AdamW
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 700000
  warmup_iter: -1  # no warm up
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-6
  cond_prob: 0.1
  
  manual_seed: 0
  val_freq: !!float 1e4
  
  criterion:
    loss1:
      is_weighted: False
      loss_type: l1
      weight: 1.0

#### logger
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1e4