# SAR 生成图像质检评估工作流 —— 全局配置
# 本文件是流水线的唯一入口配置：路径、模型/数据集/指标注册、阶段开关均在此声明。

# 运行时根目录（实际模型权重/数据集/venv 所在仓库）
root: /home/zhaozhixuan/SAR-Generation

# 远程机绝对路径前缀（manifest/meta.pkl 内硬编码，需重映射到本机 root）
remote_root: /data/zqm/SAR-Generation

# v2 评估指标引擎位置（复用，不复制实现）
v2_gan_metrics: ../SAR-image-quality-assessment-v2/gan_metrics

# 本工作流产物目录（相对 v3 根）
workspace_dir: workspace
results_dir: results

# 真实参考数据集
datasets:
  class_names: [2S1, BMP2, BRDM2, BTR60, BTR70, D7, T62, T72, ZIL131, ZSU234]
  image_root: "{root}/data/raw/MSTAR/soc"                 # train/test 下按类名分子目录
  metadata_train: "{root}/sar_models/GenModel4SAR/angle_gen/data/MSTAR_SOC_10CLASS/train/meta.pkl"
  metadata_test:  "{root}/sar_models/GenModel4SAR/angle_gen/data/MSTAR_SOC_10CLASS/test/meta.pkl"
  sizes: [128, 64]                                        # 输出两档真实参考

# 生成模型注册（4 个子目录，覆盖完整）
models:
  stylegan4sar:
    kind: stylegan
    subdir: stylegan4SAR
    venv_python: "{root}/sar_models/stylegan4SAR/.venv/bin/python"
    cwd: "{root}/sar_models/stylegan4SAR"
    size: 128
    per_class: 100                  # 每类生成张数
    seeds_per_class: 1              # 每张用独立随机 z（>=1 时顺序种子）
    pairing: "跨样本同类配对：按条件方位角在真实同类样本中取最近角（非逐像素重构，FR 偏保守）"
    variants:
      stylegan2_ada_v1:
        checkpoint: "{root}/sar_models/stylegan4SAR/training-runs/mstar_soc10_10class/stylegan2_ada_v1/00000-mstar_soc10_train_17deg_128-cond-auto1-kimg5000-batch32-ada/network-snapshot-005000.pkl"
        aasg_enabled: false
        note: "StyleGAN2-ADA 基线（无插件）"
      enhanced_stylegan4sar_v1:
        checkpoint: "{root}/sar_models/stylegan4SAR/training-runs/mstar_soc10_10class/enhanced_stylegan4sar_v1/00000-mstar_soc10_train_17deg_128-cond-auto1-kimg5000-esf-batch32-ada/network-snapshot-005000.pkl"
        aasg_enabled: true
        note: "Enhanced StyleGAN4SAR（AASG+ESF+ENL）"

  angle_gen:
    kind: angle_gen
    subdir: GenModel4SAR/angle_gen
    venv_python: "{root}/sar_models/GenModel4SAR/angle_gen/.venv/bin/python"
    cwd: "{root}/sar_models/GenModel4SAR/angle_gen"
    size: 64
    per_class: 5                    # NVS 256 步扩散约 65s/样本，默认少量
    pairing: "真·新视角合成：NVS 目标视角 vs 对应真值（FR 偏低是任务本质，重点看 AFS/ΔENL/CMAE）"
    variants:
      geometry:
        checkpoint: "{root}/sar_models/GenModel4SAR/angle_gen/experiments/diffusion_ori/pretrained/models/SAR_geometry.pt"
        network_base: xunet
        note: "SAR Geometry XUNet（真几何姿态编码）"
      baseline:
        checkpoint: "{root}/sar_models/GenModel4SAR/angle_gen/experiments/diffusion_ori/pretrained/models/baseline.pt"
        network_base: baseline_xunet
        note: "Baseline XUNet（针孔相机代理姿态）"
      adapted:
        checkpoint: "{root}/sar_models/GenModel4SAR/angle_gen/experiments/diffusion_ori/pretrained/models/latest_adapted.pt"
        network_base: xunet
        note: "XUNet 几何架构 · adapted（仓库默认 pretrain 源，step 101715）"

  frequency_gen:
    kind: frequency_gen
    subdir: GenModel4SAR/frequency_gen
    venv_python: "{root}/sar_models/GenModel4SAR/frequency_gen/.venv/bin/python"
    cwd: "{root}/sar_models/GenModel4SAR/frequency_gen"
    size: 64
    config: "{root}/sar_models/GenModel4SAR/frequency_gen/configs/pix2pix_SAR/pix2pix_vanilla_unet_bn_x2ka_b1x1_220k.py"
    checkpoint: "{root}/sar_models/GenModel4SAR/frequency_gen/work_dirs/x2ka_aircas_pretrained/ckpt/x2ka_aircas_pretrained/latest.pth"
    # 翻译任务（X→Ka 配对），无角度条件、非 MSTAR 幅度分布 → 仅适用配对 FR + SSIM
    metrics: [ssim, mse, rmse, psnr, ncc, uqi, ms_ssim, fsim]
    pairing: "翻译配对：生成 Ka vs 真值 Ka 逐像素（仅配对 FR + SSIM 适用）"
    note: "X→Ka Pix2Pix（无真实配对数据，smoke 级：仅合成单样本）"

  gaussrecon4sar:
    kind: gaussrecon
    subdir: GaussRecon4SAR
    size: 128
    source_root: "{root}/sar_models/GaussRecon4SAR/RaderImagingModel/output"
    # 3DGS 重构输出为 MSTAR T72 幅度图，与 v2 指标域一致 → 全部 13 项适用
    metrics: [fid, ssim, afs, delta_enl, bve, cmae_deg, mse, rmse, psnr, ncc, uqi, ms_ssim, fsim]
    pairing: "重构配对：渲染视图 vs 对应真值视图（逐像素 FR 可跨变体公平比较）"
    note: "3DGS 重构（预生成 renders/gt，本机 Linux 无法重新生成）"
    variants:
      image_SSIM:
        exp: image_SSIM
        iteration: ours_300000
        note: "SSIM 优化重构 30 万 iter（T72，17° 俯仰）"
      image_SSIM_sanshezhongxin:
        exp: image_SSIM_sanshezhongxin
        iteration: ours_30000
        note: "SSIM 优化重构·无三射中心 3 万 iter"
      reconstruction_CD_sanshezhongxin:
        exp: reconstruction_CD_sanshezhongxin
        iteration: ours_30000
        note: "跨俯仰重构·无三射中心 3 万 iter"

# 评估环境与参数
evaluation:
  python: "{root}/sar_models/GenModel4SAR/angle_gen/.venv/bin/python"   # py3.10 / torch2.4 / cuda
  device: cuda
  gpu: 2
  angle_estimator_epochs: 40
  asc_epochs: 20
  fid_batch: 16
  fid_pca_dim: 64
  seed: 0

# 流水线阶段（run_pipeline 按序执行；可单独 --stage 跑）
pipeline:
  stages: [prepare, generate, align, evaluate, report]
